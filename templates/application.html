<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apply for Loan</title>
<style>
  body{font-family:Poppins, sans-serif;background:linear-gradient(135deg,#f7caca,#f4a5a5);margin:0;padding:40px 10px}
  .wrap{max-width:900px;margin:0 auto;background:#fff;padding:24px;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
  h2{text-align:center;color:#d64545;margin-bottom:12px}
  form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  label{font-weight:600;margin-bottom:6px;display:block}
  input,select{padding:10px;border-radius:8px;border:1px solid #ccc;width:100%}
  .full{grid-column:1/3}
  button{grid-column:1/3;padding:12px;border:none;border-radius:10px;background:#d64545;color:#fff;font-weight:700;cursor:pointer;margin-top:6px}
</style>
</head>
<body>
  <div class="wrap">
    <h2>Loan Application Form</h2>
    <form method="POST" action="/apply-loan">
      <div>
        <label>Gender</label>
        <select name="Gender" required>
          <option value="">Select</option><option>Male</option><option>Female</option><option>Other</option>
        </select>
      </div>

      <div>
        <label>Marital Status</label>
        <select name="Married" required><option value="">Select</option><option>Yes</option><option>No</option></select>
      </div>

      <div>
        <label>Dependents</label>
        <input type="number" name="Dependents" min="0" value="0" required>
      </div>

      <div>
        <label>Education</label>
        <select name="Education" required><option value="">Select</option><option>Graduate</option><option>Not Graduate</option></select>
      </div>

      <div>
        <label>Self Employed</label>
        <select name="Self_Employed" required><option value="">Select</option><option>Yes</option><option>No</option></select>
      </div>

      <div>
        <label>Applicant Income (monthly)</label>
        <input type="number" name="ApplicantIncome" min="0" step="0.01" required>
      </div>

      <div>
        <label>Co-applicant Income (monthly)</label>
        <input type="number" name="CoapplicantIncome" min="0" step="0.01" required>
      </div>

      <div>
        <label>Loan Amount (in ₹)</label>
        <input type="number" name="LoanAmount" min="0" step="0.01" required>
      </div>

      <div>
        <label>Loan Term (months)</label>
        <input type="number" name="Loan_Amount_Term" min="1" required>
      </div>

      <div>
        <label>Credit Score (300 - 850)</label>
        <input type="number" name="Credit_Score" min="300" max="850" step="1" required>
      </div>

      <div>
        <label>Property Area</label>
        <select name="Property_Area" required><option value="">Select</option><option>Urban</option><option>Semiurban</option><option>Rural</option></select>
      </div>

      <div>
        <label>Loan Status (for admin/test)</label>
        <select name="Loan_Status" required><option value="">Select</option><option>Pending</option><option>Approved</option><option>Rejected</option></select>
      </div>

      <div class="full">
        <label>Total Income (annual)</label>
        <input type="number" name="Total_Income" min="0" step="0.01" required>
      </div>

      <button type="submit">Submit Application</button>
    </form>
    <div style="text-align:center;margin-top:12px"><a href="/" style="color:#b30000;text-decoration:none">⬅ Back to Home</a></div>
  </div>
</body>
</html>
